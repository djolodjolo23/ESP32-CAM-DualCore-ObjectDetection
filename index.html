<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Stream with Overlay</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background-color: #f4f4f4;
      margin: 0;
    }
    #streamContainer {
      position: relative;
      display: inline-block;
      transition: transform 0.3s ease-in-out;
    }
    #videoStream {
      display: block;
      max-width: 100%;
      height: auto;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    #resizeButton {
      margin-top: 20px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="streamContainer">
    <img id="videoStream" src="http://esp32-cam.local/object_detection" alt="ESP32 Stream">
    <canvas id="overlay"></canvas>
  </div>
  
  <button id="resizeButton">Double Size</button>

  <script>
    const esp32_ip = "esp32-cam.local";
    const video = document.getElementById('videoStream');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const resizeButton = document.getElementById('resizeButton');
    
    let isZoomed = false;

    video.onload = function() {
      canvas.width = video.clientWidth;
      canvas.height = video.clientHeight;
    };

    async function fetchCentroid() {
      try {
        const response = await fetch(`http://${esp32_ip}/centroid`);
        if (response.ok) {
          return await response.json();
        }
      } catch (error) {
        console.error('Error fetching centroid:', error);
      }
      return [];
    }

    async function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const displayToOriginalRatioX = canvas.width / 320;
      const displayToOriginalRatioY = canvas.height / 240;

      //console.log(displayToOriginalRatioX, displayToOriginalRatioY);

      const detections = await fetchCentroid();
      detections.forEach(obj => {
        
        let centroid_x = (obj.x + obj.width / 2) * displayToOriginalRatioX;
        let centroid_y = (obj.y + obj.height / 2) * displayToOriginalRatioY;

        //let centroid_x = obj.x * displayToOriginalRatioX;
        //let centroid_y = obj.y * displayToOriginalRatioY;
        console.log(obj.x, obj.y);

        ctx.beginPath();
        ctx.arc(centroid_x, centroid_y, 5, 0, 2 * Math.PI);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'red';
        ctx.stroke();

        ctx.fillStyle = 'red';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(obj.label, centroid_x, centroid_y - 8);
      });
    }

    setInterval(drawOverlay, 200);

    resizeButton.addEventListener('click', () => {
      if (isZoomed) {
        video.style.width = '';
        video.style.height = '';
        canvas.style.width = '';
        canvas.style.height = '';
        canvas.width = video.clientWidth;
        canvas.height = video.clientHeight;
        resizeButton.textContent = "Double Size";
      } else {
        const scaleFactor = 2;
        video.style.width = video.clientWidth * scaleFactor + 'px';
        video.style.height = 'auto'; 

        const rect = video.getBoundingClientRect();
        const newWidth = rect.width;
        const newHeight = rect.height;

        canvas.style.width = newWidth + 'px';
        canvas.style.height = newHeight + 'px';
        canvas.width = newWidth;
        canvas.height = newHeight;

        resizeButton.textContent = "Reset Size";
      }
      isZoomed = !isZoomed;
    });
  </script>
</body>
</html>

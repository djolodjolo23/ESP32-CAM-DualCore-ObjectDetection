<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Stream with Overlay</title>
  <style>
    #streamContainer {
      position: relative;
      display: inline-block;
    }
    #videoStream {
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="streamContainer">
    <img id="videoStream" src="http://192.168.0.38/mjpeg/1" alt="ESP32 Stream">
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('videoStream');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    video.onload = function() {
      canvas.width = video.clientWidth;
      canvas.height = video.clientHeight;
    };

    async function fetchCentroid() {
      try {
        const response = await fetch('http://192.168.0.38/centroid');
        if (response.ok) {
          return response.json();
        } else {
          console.error('Failed to fetch centroid:', response.status);
        }
      } catch (error) {
        console.error('Error fetching centroid:', error);
      }
      return null;
    }

    async function drawOverlay() {
      // Clear the canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const centroid = await fetchCentroid();
      if (centroid) {
        let x = centroid.x;
        let y = centroid.y;
        console.log('Centroid:', x, y);

        const x_scale = canvas.width / 96; // scaling to preserve aspect ratio
        const y_scale = canvas.height / 96; // scaling to preserve aspect ratio
        console.log('Scale:', x_scale, y_scale);
        console.log('Scaled Centroid:', x * x_scale, y * y_scale);
        x *= x_scale;
        y *= y_scale;

        ctx.beginPath();
        ctx.arc(x, y, 10, 0, 2 * Math.PI);  // Draw a circle with radius 10
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'red';
        ctx.stroke();
      }
    }

    // Poll for new centroid data every 200ms (adjust as needed)
    setInterval(drawOverlay, 200);
  </script>
</body>
</html>

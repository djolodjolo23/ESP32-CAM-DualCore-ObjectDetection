<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Stream with Overlay</title>
  <style>
    #streamContainer {
      position: relative;
      display: inline-block;
    }
    #videoStream {
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="streamContainer">
    <img id="videoStream" src="http://192.168.0.38/mjpeg/1" alt="ESP32 Stream">
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('videoStream');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    video.onload = function() {
      canvas.width = video.clientWidth;
      canvas.height = video.clientHeight;
    };

    async function fetchCentroid() {
    try {
        const response = await fetch('http://192.168.0.38/centroid');
        if (response.ok) {
            return await response.json(); // Return an array of detections
        }
    } catch (error) {
        console.error('Error fetching centroid:', error);
    }
    return [];
}

    async function drawOverlay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const detections = await fetchCentroid();
    detections.forEach(obj => {

        let centroid_x = obj.x + obj.width / 2;
        let centroid_y = obj.y + obj.height / 2;

        const x_scale = canvas.width / 96; // hardcoded to 96 for now
        const y_scale = canvas.height / 96;

        centroid_x *= x_scale;
        centroid_y *= y_scale;

        ctx.beginPath();
        ctx.arc(centroid_x, centroid_y, 10, 0, 2 * Math.PI);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'red';
        ctx.stroke();

        // Draw label
        ctx.fillStyle = 'red';
        ctx.font = '12px Arial';
        ctx.fillText(obj.label, obj.x, obj.y - 5);
        });
    }

    // Poll for new centroid data every 200ms (adjust as needed)
    setInterval(drawOverlay, 200);
  </script>
</body>
</html>
